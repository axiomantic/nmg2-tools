# The repo track's reusable workflow. Task REPO-6 creates it; the repo track
# fills it.
#
# A per-track unit is a REUSABLE WORKFLOW and it contributes a JOB, not a step.
# GitHub resolves a local reusable workflow only as `./.github/workflows/<file>`,
# and nothing outside a callee workflow can insert a step into it. Each track
# therefore declares exactly one job in its own file and adds its steps inside
# that job.
#
# This file exists in ALL SEVEN repositories, because the four artifact-boundary
# lint steps run in every one of them, and a step with no file to live in runs
# nowhere.
#
# THE FOUR STEPS CLOSE FOUR DIFFERENT HOLES AND NONE SUBSTITUTES FOR ANOTHER.
#   no-private-submodule    stops the private repository's URL and commit
#                           hashes being published.
#   no-clavia-payload       stops a Clavia byte reaching a public tree as a
#                           committed file.
#   no-clavia-upload        stops a Clavia byte LEAVING a public runner as a
#                           build artifact. That route has no committed file in
#                           it at all, so the payload step cannot see it.
#   no-artifact-credential  stops a public repository holding the credential
#                           that would let it fetch one.

name: track-repo

on:
  workflow_call:
    inputs:
      visibility:
        description: >-
          The calling repository's visibility, `public` or `private`. One clause
          of the credential lint is scoped to public repositories: a `secrets.`
          reference outside the three organization momus secrets is a defect in
          a public repository, while inside the private one the T1 and T2 jobs
          legitimately hold what they need. The other three steps apply to all
          seven repositories without exception.
        required: false
        type: string
        default: public

permissions:
  contents: read

jobs:
  repo-lints:
    name: repo-lints
    runs-on: ubuntu-latest
    steps:
    # EVERY GUARD REPORTS INDEPENDENTLY. Actions skips the remaining steps of a
    # job once one has failed, so with a plain sequential list guard N failing
    # made guards N+1..end report `skipped` -- a word that is not `success` and
    # is not `failure`, and that reads to a human as "not applicable here".
    # These guards close FOUR DIFFERENT holes and none substitutes for another,
    # so one of them firing is the WORST moment to stop asking the others: the
    # tree is already known to be wrong, and the run silently stops saying how
    # wrong. In this repository that is not hypothetical; see the PR body.
    #
    # `!cancelled()` rather than `always()`: a cancelled run should stop, and a
    # failed one should finish reporting. Neither form makes the JOB green -- a
    # step that runs and fails still fails the job, so the overall verdict is
    # unchanged and only the amount the run tells you goes up.
      - name: Check out the repository under test
        uses: actions/checkout@v4
        with:
          path: under-test

      # The four lint scripts live in the tools repository, which is PUBLIC.
      # Reading it needs no credential of any kind.
      - name: Check out the lint scripts
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nmg2-tools
          path: lint-tools

      - name: Set up Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: no-private-submodule
        if: ${{ !cancelled() }}
        working-directory: lint-tools
        run: python3 -m nmg2_tools.submodule_lint "${GITHUB_WORKSPACE}/under-test"

      - name: no-clavia-payload
        if: ${{ !cancelled() }}
        working-directory: lint-tools
        run: |
          python3 -m nmg2_tools.payload_lint "${GITHUB_WORKSPACE}/under-test" \
            --register nmg2_tools/testdata/register.tsv \
            --visibility "${{ inputs.visibility }}" \
            --repo "${{ github.repository }}"

      # The upload step reads the WHOLE workflow text and NOT an action
      # allow-list. A `run: gh release download` against the private
      # repository, a `curl` against a private release asset and a `git clone`
      # of the private repository are none of `upload-artifact`, `cache` or
      # `download-artifact`, and an action allow-list passes all three
      # untouched.
      #
      # The patterns below are assembled from split string literals ON PURPOSE.
      # This step scans EVERY workflow file in the repository, including this
      # one. A pattern written as one literal would match its own definition
      # and the step would fail on itself for ever.
      - name: no-clavia-upload
        if: ${{ !cancelled() }}
        env:
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -uo pipefail
          pa="nmg2""-artifacts"
          pb="gold""en/"
          pc="captu""res/"
          pd="corp""us/"
          pe="fixtures/proto""col/"
          pf="[._]dum""p\b"
          patterns="${pa}|${pb}|${pc}|${pd}|${pe}|${pf}"
          # The allow-list is the set of jobs the plan places INSIDE the private
          # repository. That is exactly one workflow file, and it is allow-listed
          # only when the calling repository is the private one.
          allow=""
          if [ "${VISIBILITY}" = "private" ]; then
            allow="t1-t2.yml"
          fi
          fail=0
          for f in under-test/.github/workflows/*.yml under-test/.github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if [ -n "${allow}" ] && [ "${base}" = "${allow}" ]; then
              echo "allow-listed: ${base}"
              continue
            fi
            if grep -nEi "${patterns}" "$f"; then
              echo "FAILURE no-clavia-upload: ${f} names the private repository or an artifact-tree path."
              fail=1
            fi
          done
          exit "${fail}"

      # REPO-7, THE SKIP DISCIPLINE. Design section 18.5 steps 3 and 4.
      #
      #   3. The CI job prints a summary line with the counts: run, passed,
      #      failed, skipped.
      #   4. A run that executed zero gated tests is reported as NOT VERIFIED,
      #      not as PASS. The job's own summary says so in plain words.
      #
      # "run" counts gated tests that EXECUTED THEIR BODY. A skipped test is not
      # a run test, which is what makes "a run that executed zero gated tests"
      # the condition run == 0. gatedFixture.h in the gearmulator fork carries
      # the same three verdict tokens and the same rule, and t0_skip_discipline
      # is the check that proves the rule fires -- including the negative case,
      # that a job which ran one gated test does NOT print NOT VERIFIED.
      #
      # THE COUNT LABELS ARE LOWERCASE AND THE VERDICT TOKENS ARE UPPERCASE, so
      # that "the summary never prints PASS" is a case-sensitive property which
      # "passed=0" cannot satisfy by accident.
      #
      # WHERE THE COUNTS COME FROM, STATED HONESTLY: a job that runs gated tests
      # writes gated-tests.counts at the root of the repository under test, with
      # one "name=integer" line per count. NO REPOSITORY PRODUCES THAT FILE
      # TODAY -- the first gated tests are T1 and T2, they run inside the private
      # repository, and this file exists in all seven repositories. Until one
      # does, every repository prints NOT VERIFIED, WHICH IS THE TRUE ANSWER: no
      # gated test has been verified here. A step that printed PASS instead
      # would be the exact green tick design section 18.5 exists to prevent.
      #
      # THE VERDICT IS THE STEP'S EXIT STATUS, AND THAT IS THE WHOLE POINT.
      # This step used to echo the verdict and exit 0 on every path, so a job
      # whose gated tests had FAILED and a job that had verified nothing at all
      # both rendered a green tick. A summary that computes PASS / FAIL / NOT
      # VERIFIED and cannot fail is exactly the defect design section 18.5
      # names, wearing the costume of the guard against it -- the operator sees
      # a verdict printed in a step marked success, and the printed word is the
      # only place the difference lives.
      #
      # FAIL is non-zero for the obvious reason. NOT VERIFIED IS ALSO NON-ZERO,
      # because "no gated test executed its body" is the absence this job exists
      # to detect, and an absence reported through a green step is reported
      # nowhere. The three verdicts now reach CI as two exit statuses, and PASS
      # is the only one that is zero.
      #
      # This supersedes the earlier reading of design section 19.1 -- that T1
      # and T2 are informational tiers, so this reporter should not carry an
      # exit status. Tier informationality is about which tests block a merge.
      # It is not licence for the step that renders their verdict to be unable
      # to report one. The job that runs a gated test still owns its own exit
      # status; this step owns whether its own summary was believed.
      #
      # CONSEQUENCE, STATED PLAINLY: no repository writes gated-tests.counts
      # today, so this step now fails in every repository that runs it, with
      # the reason printed. That red is the true answer the comment below has
      # always claimed to give. Silencing it means producing the file, not
      # restoring the exit 0.
      - name: gated-test-summary
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          counts="${GITHUB_WORKSPACE}/under-test/gated-tests.counts"
          run=0
          passed=0
          failed=0
          skipped=0
          if [ -f "${counts}" ]; then
            for name in run passed failed skipped; do
              value=$(awk -F= -v key="${name}" '$1 == key { print $2 + 0 }' "${counts}" | tail -n 1)
              [ -n "${value}" ] || value=0
              eval "${name}=\${value}"
            done
          else
            echo "no gated-tests.counts in the repository under test; every count is zero."
          fi
          verdict="NOT VERIFIED"
          if [ "${run}" -gt 0 ]; then
            if [ "${failed}" -gt 0 ]; then
              verdict="FAIL"
            else
              verdict="PASS"
            fi
          fi
          line="gated tests: run=${run} passed=${passed} failed=${failed} skipped=${skipped} -- ${verdict}"
          echo "${line}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "${line}" >> "${GITHUB_STEP_SUMMARY}"
          fi

          case "${verdict}" in
            PASS)
              exit 0
              ;;
            FAIL)
              echo "FAILURE gated-test-summary: ${failed} of the ${run} gated test(s) that ran did not pass."
              exit 1
              ;;
            *)
              echo "FAILURE gated-test-summary: NOT VERIFIED is not a pass."
              echo "Zero gated tests executed their body here, so this job has proved"
              echo "nothing about the gated tiers. Produce gated-tests.counts in the"
              echo "repository under test to make this step able to say PASS."
              exit 1
              ;;
          esac

      - name: no-artifact-credential
        if: ${{ !cancelled() }}
        working-directory: lint-tools
        run: |
          python3 -m nmg2_tools.credential_lint "${GITHUB_WORKSPACE}/under-test" \
            --visibility "${{ inputs.visibility }}"
