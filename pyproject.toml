[build-system]
# setuptools 77.0.0 is the first release that accepts a PEP 639 SPDX `license`
# string and a `license-files` list. The floor is 77, not 68, because the
# `license = "MIT"` field below is a build error on any older backend.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nmg2-tools"
version = "0.0.0"
description = "Python tools for the Nord Modular G2 emulator project"
requires-python = ">=3.11"
# PEP 639. `license` is an SPDX expression string, not the deprecated table
# form, and not a `License ::` trove classifier. Both of those are deprecated
# and setuptools warns on them.
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
# One package. `nmg2_tools/` holds the Nord Modular G2 tooling: the firmware
# container and extractors, the `.pch2` reader, the DSP disassembler and the
# wire composer. A package this list does not name is a package
# `pip install .` does not install.
packages = ["nmg2_tools"]

[tool.pytest.ini_options]
# The layout is fixed. Every test lives at `tests/` in the repository root, and
# never inside the package. `pythonpath` puts the repository root on the import
# path so that a test imports `nmg2_tools` without an install step.
testpaths = ["tests"]
pythonpath = ["."]
